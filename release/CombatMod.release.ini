; Cinematic Combat (CombatMod) - settings file. Keep it next to CombatMod.asi (the game's bin64 folder).
; Edit it with the game CLOSED, or use the in-game panel (Ctrl+Enter / LB + DPad-Down) and press "Save & Close".
; Switches are 1 = on, 0 = off. Lines starting with ; are comments. A broken or missing value is ignored and the default is used.
; Note: "Save & Close" rewrites the [Cinematic] and [Advanced] blocks of this file (the long comments there are replaced by short ones).
; To go back to the shipped settings, copy CombatMod.ini from the download again. (The panel's presets are looks of their own: Vanilla switches everything off; the others keep your Minimum launch, Blinding Flash and throw choices.)

[General]
; Master switch. 0 = the plugin loads but does nothing at all.
Enabled=1
; The developer bridge (a local network port used for debugging) is OFF in a release. Leave it at 0: nothing in the mod needs it.
BridgeEnabled=0
; Developer permission gates of that bridge. They are all 0 in a release; they only matter when BridgeEnabled=1.
AllowWrite=0
AllowTrace=0
AllowWatch=0
AllowInput=0
AllowCall=0
; Developer-only keys, present for completeness and deliberately commented out. Do not enable them for normal play.
; BridgePort=6400
; EnableHooks=0
; SampleTimeCurve=0
; InitDelayMs=0

[UI]
; The in-game control panel. On: it is the main way to tune the mod and costs nothing while closed.
Enabled=1
; Hotkey that opens / closes the panel (on an Xbox pad: LB + DPad-Down). Examples: Ctrl+Enter, Ctrl+Shift+F5, Alt+Space.
ToggleKeyboard=Ctrl+Enter
; Opacity of the panel window, 60..255 (240 = almost solid; stays readable over a bright scene).
Alpha=240
; 1 = open the panel by itself shortly after the game starts. Off: a normal game start must not show a window.
StartOpen=0

[Telemetry]
; Developer patch-diff recorder (writes a JSON file about the game's events to a CombatMod_telemetry folder every minute and keeps an
; extra hook active all the time). Off in a release: players do not need it and it costs CPU and disk.
Enabled=0
; Dir=
; MaxMB=20

; [Skills]
; Enabled=0
; [TimeAmp]
; ContextWindowMs=800
; ContextAnyThread=1
; RequireCtx=0
; AllowKeys=10253,10258
; OnlyOwner=auto
; ScaleOverrides=0.6:0.35,0.1:0.04

[Cinematic]
; ---- First-run defaults of 0.9.0-beta: the "Cinematic" look with a few things switched off. Why each value: ----
; Slow-motion amplifier ON: this is the main feature; with it off the mod would do nothing visible on the first start.
SlowMo.Enabled=1
; Strength 0.5: the game's own slow motion plays at half of its normal speed (twice as slow). Clearly visible, never a slideshow.
SlowMo.ScaleMul=0.5
; Ramps 1.6x longer: the slow-down and the return to normal speed are smoother (same value as the Cinematic preset).
SlowMo.RampInMul=1.6
SlowMo.RampOutMul=1.6
; Slow-motion cap per chain 6 s: a long fight chain falls back to normal speed after 6 s of continuous slow motion, so a big fight never stays slow forever. It only SHORTENS slow motion.
SlowMo.MaxChainSeconds=6
; Explosions and towers that YOU set off are slowed too (their slow motion is native; only your own explosions count). On: part of the look.
SlowMo.Gimmicks=1
; Blinding Flash mode 0 = the game's own slow motion (then SlowMo.* applies). Modes 1 and 2 re-time that skill and are for people who want them.
BlindingFlash.Mode=0
; The remaining Blinding Flash numbers only matter in modes 1 / 2. They are at their built-in defaults. Chain speed 1.0 = normal; higher is locked (see [Advanced]).
BlindingFlash.ChainSpeed=1
BlindingFlash.HitScale=0.5
BlindingFlash.HitRamp=1.5
BlindingFlash.FinaleScale=0.25
BlindingFlash.FinaleRamp=2.5
; Launch (knock-back) boost ON, x2: enemies hit by launching attacks fly about twice as far. Easy to feel, easy to turn off in the panel.
Launch.Enabled=1
Launch.Mult=2
; Minimum launch 25: attacks that launch weakly or not at all (many have 0) are raised to 25 BEFORE the x2, so ordinary heavy hits knock back too.
; Set 0 for a plain x2 of what the game already launches. A HIGH minimum makes attacks that normally do not launch at all launch enemies. Explosive arrows and bombs are never raised (see Launch.DenyKeys below).
Launch.MinValue=25
; Angle x1 = unchanged. Experimental setting, so it is left alone.
Launch.AngleMul=1
; Hit reaction of the Blinding Flash finale (the throw-back hit): 0 = the game's own, 1 = knock-down, 2 = ground throw, 3 = ragdoll fling. 2: the game picks a different reaction per cast,
; so the throw-back is inconsistent; the ground throw makes it the same every time. Changed for that single hit only, never for enemies.
Reaction.Finale=2
; Hit reaction of Turning Slash hits (same values). 0 = the game's own: left alone until you choose.
Reaction.TurningSlash=0
; Hit-stop control OFF: experimental, and the game's own impact pauses are already part of how hits feel. The sliders below are kept at neutral.
HitStop.Enabled=0
HitStop.ScaleMul=1
HitStop.DurMul=1
; Pause the game while the panel is open ON: you can tune sliders without being attacked. Turn off if you prefer the world to keep running.
UI.PauseGame=1
; Your own custom slow-motion rules ([Triggers] below) OFF: no rule ships enabled, so this switch would do nothing.
Triggers.Enabled=0
; Slow motion for tower / explosive-arrow explosions ON: the game has none of its own, so this is the one trigger that adds to the look.
Triggers.TowerBlast=1

[Advanced]
; Not shown in the panel. Every line below is commented out and shows the built-in default (so the mod behaves exactly as written here).
; Remove the ; of a line and change the value to tune it. The first "Save & Close" in the panel writes this block out in full.
; Roll / evade skills that never trigger the slow-motion amplifier (so dodging does not slow the game by itself).
; SlowMo.DenyKeys=10010,10031,10072,10278,10279,10086
; Records the launch boost never touches: the explosive arrow (1091:5) and the bomb / tower gimmick (60002), so towers and bombs keep their normal blast.
; Launch.DenyKeys=1091:5,60002
; 1 = a custom trigger may replace a native slow motion that is already running. Off: your rules wait for the game's own effect to finish.
; Triggers.Override=0
; Blinding Flash: skill key0 values that mark the throw-back finale of a chain (1023 on the weapons tested).
; BlindingFlash.FinaleKeys=1023
; Skill keys whose use starts the Turning Slash window for Reaction.TurningSlash (10253; add the fist variant's key here).
; Reaction.TurningSlashKeys=10253
; 1 = Blinding Flash Chain speed may go above 1.0. WARNING: that speeds up EVERYONE (enemies and NPCs too), because the game has one global clock.
; BlindingFlash.UnlockSpeedUp=0
; Gimmick owners (bombs, towers) whose slow motion counts as yours, and how long after your skill / arrow (ms) that still applies.
; SlowMo.GimmickKeys=60002
; SlowMo.GimmickWindowMs=1500
; The built-in tower / explosive-arrow slow motion: time scale, ramp in, hold, ramp out (seconds) and the minimum time between two (ms).
; Triggers.TowerScale=0.1
; Triggers.TowerIn=0.03
; Triggers.TowerHold=0.35
; Triggers.TowerOut=1.4
; Triggers.TowerCooldownMs=3000

[Triggers]
; Custom slow-motion rules (they need Triggers.Enabled=1 in [Cinematic]). No rule is active by default.
; One line per rule:  Trigger<n> = key=<SkillKey list>|owner=player|scale=0.15|in=0.10|hold=0.5|out=0.45|cooldownMs=1500|firstOnly=1|delayMs=0|name=<text>
; Rules only react to YOUR skills. This example is switched off (enabled=0):
Trigger1 = name=Example|enabled=0|key=12345|owner=player|scale=0.2|in=0.1|hold=0.4|out=0.3|cooldownMs=1500|firstOnly=1|delayMs=0
